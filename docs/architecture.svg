<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">AWS 기초 웹 인프라 아키텍처</title>
  <desc id="desc">EC2 내부에서 Nginx가 실행되는 관계와 노트북에서 EC2로 들어오는 SSH 경로, EC2에서 example.com으로 나가는 curl 경로를 보여주는 VPC 구조도</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#16a34a"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", Arial, sans-serif; }
      .small { font-size: 20px; fill: #64748b; }
      .label { font-size: 23px; font-weight: 700; }
      .title { font-size: 30px; font-weight: 800; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#f8fafc"/>

  <!-- Laptop -->
  <g transform="translate(105 85)">
    <rect x="6" y="0" width="170" height="105" rx="12" fill="#fff" stroke="#172033" stroke-width="4"/>
    <rect x="21" y="15" width="140" height="75" rx="4" fill="#eff6ff"/>
    <path d="M0 112 H182 L164 132 H18 Z" fill="#94a3b8"/>
    <rect x="66" y="116" width="50" height="5" rx="2.5" fill="#e2e8f0"/>
    <text x="91" y="172" text-anchor="middle" class="label">내 노트북</text>
    <text x="91" y="202" text-anchor="middle" class="small">운영자</text>
  </g>

  <!-- Internet cloud -->
  <g transform="translate(650 76)">
    <circle cx="75" cy="77" r="55" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
    <circle cx="150" cy="55" r="70" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
    <circle cx="230" cy="80" r="58" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
    <rect x="55" y="75" width="235" height="72" rx="36" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/>
    <text x="172" y="121" text-anchor="middle" font-size="31" font-weight="800" fill="#2563eb">인터넷</text>
  </g>

  <!-- example.com -->
  <g transform="translate(1295 85)">
    <rect width="190" height="145" rx="15" fill="#fff" stroke="#172033" stroke-width="4"/>
    <path d="M0 42 H190" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="21" cy="21" r="6" fill="#dc2626"/>
    <circle cx="42" cy="21" r="6" fill="#f97316"/>
    <circle cx="63" cy="21" r="6" fill="#16a34a"/>
    <circle cx="95" cy="82" r="25" fill="none" stroke="#2563eb" stroke-width="4"/>
    <path d="M70 82 H120 M95 57 V107 M78 65 Q95 82 78 99 M112 65 Q95 82 112 99" fill="none" stroke="#2563eb" stroke-width="3"/>
    <text x="95" y="176" text-anchor="middle" class="label">example.com</text>
    <text x="95" y="206" text-anchor="middle" class="small">외부 서비스</text>
  </g>

  <!-- VPC -->
  <rect x="70" y="385" width="1460" height="555" rx="30" fill="#fff" stroke="#2563eb" stroke-width="5"/>
  <path d="M100 385 H1500 Q1530 385 1530 415 V460 H70 V415 Q70 385 100 385 Z" fill="#2563eb"/>
  <text x="115" y="435" font-size="34" font-weight="800" fill="#fff">VPC</text>
  <text x="225" y="435" font-size="24" font-weight="700" fill="#dbeafe" class="mono">10.0.0.0/16</text>

  <!-- Public subnet -->
  <rect x="125" y="495" width="1350" height="385" rx="24" fill="#f0fdf4" stroke="#16a34a" stroke-width="4"/>
  <path d="M149 495 H1451 Q1475 495 1475 519 V558 H125 V519 Q125 495 149 495 Z" fill="#dcfce7"/>
  <text x="170" y="538" font-size="28" font-weight="800" fill="#15803d">Public Subnet</text>
  <text x="405" y="538" font-size="21" font-weight="700" fill="#15803d" class="mono">10.0.1.0/24 · ap-northeast-2a</text>

  <!-- Internet Gateway -->
  <g filter="url(#shadow)">
    <rect x="630" y="345" width="340" height="88" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="4"/>
    <circle cx="686" cy="389" r="27" fill="#f97316"/>
    <path d="M686 371 V407 M672 385 L686 371 L700 385 M672 393 L686 407 L700 393" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="732" y="398" font-size="29" font-weight="800" fill="#c2410c">Internet Gateway</text>
  </g>

  <!-- Public route -->
  <g filter="url(#shadow)">
    <rect x="925" y="585" width="440" height="65" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="957" y="626" font-size="21" font-weight="700" fill="#64748b">Public Route</text>
    <text x="1120" y="626" font-size="21" font-weight="800" class="mono">0.0.0.0/0 → IGW</text>
  </g>

  <!-- EC2 인스턴스와 그 안에서 실행되는 Nginx -->
  <g filter="url(#shadow)">
    <rect x="265" y="600" width="510" height="240" rx="22" fill="#fff" stroke="#f97316" stroke-width="3"/>
    <rect x="300" y="630" width="82" height="66" rx="14" fill="#f97316"/>
    <text x="341" y="671" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">EC2</text>
    <text x="415" y="653" font-size="28" font-weight="800">EC2 인스턴스</text>
    <text x="415" y="687" class="small">Ubuntu 24.04 LTS · Public IP</text>

    <rect x="300" y="720" width="440" height="88" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
    <polygon points="330,754 358,738 386,754 386,786 358,802 330,786" fill="#16a34a"/>
    <text x="358" y="778" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">N</text>
    <text x="410" y="754" font-size="25" font-weight="800" fill="#15803d">Nginx</text>
    <text x="410" y="788" font-size="19" fill="#15803d">EC2 내부에서 실행 · :80 · / · /health</text>
  </g>

  <!-- Security Group card -->
  <g filter="url(#shadow)">
    <rect x="925" y="680" width="440" height="160" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M970 715 L997 727 L992 761 Q983 779 970 786 Q957 779 948 761 L943 727 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <path d="M958 750 L967 759 L984 739" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1020" y="728" font-size="25" font-weight="800">Security Group</text>
    <text x="1020" y="757" class="small">codyssey-web-sg</text>
    <rect x="955" y="780" width="185" height="42" rx="21" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="1048" y="807" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">SSH :22 · 내 IP/32</text>
    <rect x="1152" y="780" width="185" height="42" rx="21" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="1245" y="807" text-anchor="middle" font-size="17" font-weight="700" fill="#15803d">HTTP :80 · 0.0.0.0/0</text>
  </g>

  <!-- Inbound SSH path -->
  <path d="M290 145 H640" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <rect x="370" y="93" width="205" height="44" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="472" y="122" text-anchor="middle" font-size="19" font-weight="800" fill="#2563eb">SSH :22 · 인바운드</text>
  <path d="M760 225 V340" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <path d="M742 433 V575 H220 V650 H257" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>

  <!-- Outbound curl path -->
  <path d="M640 600 V575 H858 V433" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <path d="M858 340 V225" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <path d="M950 145 H1285" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <rect x="1015" y="93" width="245" height="44" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1138" y="122" text-anchor="middle" font-size="19" font-weight="800" fill="#15803d">curl HTTPS · 아웃바운드</text>

  <!-- Traffic legend -->
  <g filter="url(#shadow)">
    <rect x="175" y="965" width="1250" height="105" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="215" y="1008" font-size="22" font-weight="800">트래픽 흐름</text>
    <text x="215" y="1040" class="small">화살표 색과 방향</text>

    <rect x="420" y="985" width="420" height="65" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <path d="M450 1018 H505" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <text x="535" y="1011" font-size="20" font-weight="800" fill="#2563eb">인바운드 · 파란색</text>
    <text x="535" y="1037" font-size="17" fill="#2563eb">내 노트북 → EC2</text>

    <rect x="870" y="985" width="420" height="65" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <path d="M900 1018 H955" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-green)"/>
    <text x="985" y="1011" font-size="20" font-weight="800" fill="#15803d">아웃바운드 · 초록색</text>
    <text x="985" y="1037" font-size="17" fill="#15803d">EC2 → example.com</text>
  </g>
</svg>
